<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2B2350">
<title>Biblioteca del CEIP Fernando IV</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="img/icono-192.png">
<link rel="apple-touch-icon" href="img/icono-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Biblioteca">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preload" as="image" href="img/biblioteca.webp">
<link rel="preload" as="image" href="img/escudo-180.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --papel:#F6F2EC; --papel2:#ECE5F0; --blanco:#FFFEFB;
  --tinta:#2B2350; --tinta2:#544C78; --suave:#8C87A3;
  --linea:#E3DCEA; --musgo:#2F8550; --musgo-bg:#E2F2E6;
  --teja:#B03A86; --teja-bg:#F8E3F0; --oro:#E2AE34; --cielo:#3E8FD8;
  --radio:22px; --sombra:0 1px 2px rgba(43,35,80,.06),0 8px 24px rgba(43,35,80,.09);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;background:var(--papel);color:var(--tinta);font-family:Inter,system-ui,sans-serif;font-size:16px;line-height:1.45}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;touch-action:manipulation}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding:calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + 96px)}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:700;letter-spacing:-.01em}

/* Cabecera */
.cab{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.cab-izq{display:flex;align-items:center;gap:12px;min-width:0}
.escudo{width:52px;height:auto;flex-shrink:0;filter:drop-shadow(0 3px 6px rgba(43,35,80,.18))}
.pie-centro{text-align:center;margin-top:28px}
.pie-centro img{width:96px;height:auto;opacity:.95;filter:drop-shadow(0 4px 10px rgba(43,35,80,.15))}
.pie-centro p{font-family:Fraunces,serif;font-size:15px;color:var(--tinta2);margin-top:6px}
.cab .t{font-family:Fraunces,serif;font-size:28px;font-weight:700;line-height:1.1}
.cab .centro{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--teja);margin-bottom:2px}
.cab .s{font-size:13px;color:var(--suave)}
.avatar{flex-shrink:0;width:42px;height:42px;border-radius:50%;background:var(--tinta);color:var(--papel);display:grid;place-items:center;font-weight:700}

/* Tarjetas */
.card{background:var(--blanco);border-radius:var(--radio);box-shadow:var(--sombra);padding:18px;position:relative;overflow:hidden}
.card+.card,.grid2+.card,.card+.grid2{margin-top:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:stretch}
.grid2>.card{margin-top:0!important;height:100%}
.etq{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--suave)}
.hero{color:#fff;padding:150px 22px 22px;background:
  linear-gradient(180deg,rgba(43,35,80,0) 0%,rgba(43,35,80,.35) 28%,rgba(43,35,80,.9) 52%,#2B2350 70%),
  url(img/biblioteca.webp) 68% 35%/cover no-repeat,var(--tinta)}
.hero .etq{color:#F3D27A}
.hero .estado{font-family:Fraunces,serif;font-size:32px;margin:6px 0 2px}
.hero .det{color:#E4DEF3;font-size:15px;min-height:22px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:13px;font-weight:600}
.pill.libre{background:var(--musgo-bg);color:var(--musgo)}
.pill.ocupada{background:var(--teja-bg);color:var(--teja)}
.pill.neutra-c{background:var(--papel2);color:var(--tinta2)}
.pill.neutra{background:rgba(255,255,255,.14);color:#F1EEF9}
.punto{width:8px;height:8px;border-radius:50%;background:currentColor}
.tramos-hoy{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px}
.th{background:rgba(255,255,255,.07);border-radius:14px;padding:10px 8px;text-align:center;border:1px solid rgba(255,255,255,.08)}
.th .h{font-size:12px;color:#C9C2E0}
.th .q{font-size:13px;font-weight:600;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th.ocu{background:rgba(176,58,134,.22);border-color:rgba(176,58,134,.4)}
.th.act{outline:2px solid var(--oro)}
.th.act .h{color:var(--oro);font-weight:700}
.th.pas{opacity:.45}
.mini{min-height:150px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;width:100%}
.mini .n{font-family:Fraunces,serif;font-size:34px;line-height:1}
.mini .sub{font-size:13px;color:var(--tinta2);margin-top:6px;min-height:2.9em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.icono{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:19px;background:var(--papel)}
.fila{display:flex;align-items:center;justify-content:space-between;gap:12px}
.ir{font-size:20px;color:var(--suave)}
.badge{background:var(--teja);color:#fff;font-size:12px;font-weight:700;border-radius:999px;padding:2px 8px}

/* Calendario */
.mesnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.mesnav h2{font-size:24px}
.redondo{width:42px;height:42px;border-radius:50%;background:var(--blanco);box-shadow:var(--sombra);font-size:20px;display:grid;place-items:center}
.cal{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.cal .dsem{text-align:center;font-size:12px;font-weight:700;color:var(--suave);padding-bottom:2px}
.dia{background:var(--blanco);border-radius:14px;aspect-ratio:1/1.15;padding:8px 7px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 1px 2px rgba(43,35,80,.06);border:2px solid transparent;text-align:left}
.dia .num{font-weight:700;font-size:15px}
.dia .barras{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
.dia .barras i{height:6px;border-radius:3px;background:#C9E7D2}
.dia .barras i.o{background:var(--teja)}
.dia.hoy{border-color:var(--tinta)}
.dia.pasado{opacity:.45}
.dia.fest{background:var(--papel2)}
.dia.fest .barras{display:none}
.dia .fl{font-size:10px;color:var(--tinta2);line-height:1.15;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dia.vacio{background:transparent;box-shadow:none}
.leyenda{display:flex;justify-content:center;gap:18px;margin-top:16px;font-size:13px;color:var(--tinta2)}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.leyenda i{width:16px;height:6px;border-radius:3px;display:inline-block}

/* Listas */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--papel2);border-radius:14px;padding:4px;margin-bottom:16px}
.seg button{padding:10px;border-radius:11px;font-weight:600;color:var(--tinta2)}
.seg button.on{background:var(--blanco);color:var(--tinta);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.item{width:100%;text-align:left;display:block}
.item h3{font-size:18px;margin-bottom:4px}
.item p{color:var(--tinta2);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{font-size:12px;color:var(--suave);margin-top:10px}
.estrellas{color:var(--oro);letter-spacing:2px}
.vacio-msg{text-align:center;color:var(--suave);padding:40px 10px}

/* Formularios y botones */
label{display:block;font-size:13px;font-weight:600;color:var(--tinta2);margin:14px 0 6px}
input,textarea{width:100%;padding:13px 14px;border-radius:14px;border:1.5px solid var(--linea);background:var(--blanco);outline:none}
input:focus,textarea:focus{border-color:var(--tinta)}
textarea{min-height:120px;resize:vertical}
.btn{display:block;width:100%;padding:14px;border-radius:14px;background:var(--tinta);color:var(--papel);font-weight:600;margin-top:18px}
.btn.sec{background:var(--papel2);color:var(--tinta)}
.btn.peligro{background:var(--teja-bg);color:var(--teja)}
.btn:disabled{opacity:.5}
.btn-peq{padding:8px 14px;border-radius:11px;font-weight:600;font-size:14px;background:var(--tinta);color:var(--papel)}
.btn-peq.ajusta{padding:8px 4px;font-size:13px}
.btn-peq.sec{background:var(--papel2);color:var(--tinta)}
.btn-peq.peligro{background:var(--teja-bg);color:var(--teja)}
.ayuda{font-size:13px;color:var(--suave);margin-top:8px}
.selector-estrellas{display:flex;gap:8px;font-size:34px;color:var(--linea)}
.selector-estrellas button.on{color:var(--oro)}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.rol{text-align:center;padding:26px 12px}
.rol .e{font-size:38px}
.rol h3{margin-top:10px;font-size:19px}
.rol p{font-size:13px;color:var(--tinta2);margin-top:4px}
.codigo{font-family:ui-monospace,Menlo,monospace;font-weight:700;background:var(--papel);padding:4px 10px;border-radius:8px;letter-spacing:.05em}
.linea{border-top:1px solid var(--linea);margin:14px 0}
.tramo-fila{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--linea)}
.tramo-fila:last-child{border-bottom:0}
.tramo-fila .hora{width:62px;font-weight:700;font-size:14px;line-height:1.2}
.tramo-fila .hora small{display:block;color:var(--suave);font-weight:500}
.tramo-fila .info{flex:1;min-width:0}
.tramo-fila .info b{display:block}
.tramo-fila .info span{font-size:13px;color:var(--tinta2)}
.reservar-form{display:flex;gap:8px;margin-top:8px}
.crear-clase{display:grid;grid-template-columns:1fr 104px auto;gap:8px;margin-top:12px}
.crear-clase input{padding:10px;font-size:15px;min-width:0}
.aviso-num{margin-top:8px;background:#FBF3DC;border:1px solid #F0DDA4;border-radius:12px;padding:8px 12px;font-size:13px;display:flex;gap:8px;align-items:center;justify-content:space-between}
.clase-off b,.clase-off .codigo,.clase-off .part,.clase-off .num-al{opacity:.45}
.clase-off .codigo{text-decoration:line-through}
.num-al{font-size:13px;font-weight:500}
.selector .chip{padding:9px 14px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{padding:6px 12px;border-radius:999px;background:var(--papel2);color:var(--tinta);font-size:13px;font-weight:600;border:1.5px solid transparent}
.chip.on{background:var(--tinta);color:#fff}
.chip small{opacity:.6;font-weight:700;margin-left:2px}
.part{margin-top:10px}
.part .chips{margin-top:6px}
.reservar-form input{padding:10px 12px}

/* Barra inferior */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 12px);width:min(530px,calc(100% - 28px));background:rgba(43,35,80,.96);backdrop-filter:blur(10px);border-radius:24px;display:grid;grid-template-columns:repeat(4,1fr);padding:8px;z-index:20;box-shadow:0 10px 30px rgba(43,35,80,.3)}
.tabbar.tres{grid-template-columns:repeat(3,1fr)}
.tabbar.tres button[data-v=calendario]{display:none}
.tabbar button{color:#A9A2C6;font-size:11px;font-weight:600;padding:6px 0;border-radius:16px;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabbar button .e{font-size:20px;filter:grayscale(1);opacity:.75}
.tabbar button.on{color:var(--papel);background:rgba(255,255,255,.08)}
.tabbar button.on .e{filter:none;opacity:1}

/* Hoja inferior */
.velo{position:fixed;inset:0;background:rgba(25,18,48,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.velo.on{opacity:1;pointer-events:auto}
.hoja{position:fixed;left:50%;bottom:0;transform:translate(-50%,100%);width:min(560px,100%);max-height:88vh;overflow:auto;background:var(--blanco);border-radius:26px 26px 0 0;padding:10px 20px calc(env(safe-area-inset-bottom) + 24px);z-index:41;transition:transform .25s ease}
.hoja.on{transform:translate(-50%,0)}
.hoja .asa{width:44px;height:5px;border-radius:3px;background:var(--linea);margin:4px auto 14px}
.hoja h2{font-size:23px;margin-bottom:4px}

.fab{position:fixed;right:max(18px,calc(50% - 262px));bottom:calc(env(safe-area-inset-bottom) + 96px);background:var(--teja);color:#fff;font-weight:700;padding:14px 20px;border-radius:999px;box-shadow:0 8px 20px rgba(176,58,134,.4);z-index:15}
.aviso{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translate(-50%,-150%);background:var(--tinta);color:var(--papel);padding:12px 18px;border-radius:14px;font-size:14px;font-weight:500;z-index:60;transition:transform .25s;max-width:calc(100% - 32px);text-align:center}
.aviso.on{transform:translate(-50%,0)}
.aviso.error{background:var(--teja)}
.instalar{background:linear-gradient(135deg,#FFFEFB 0%,#F4EEF8 100%);border:1.5px solid var(--linea)}
.instalar .cerrar{position:absolute;top:10px;right:12px;width:30px;height:30px;border-radius:50%;color:var(--suave);font-size:14px}
.instalar .cerrar:hover{background:var(--papel2)}
.ico-app{width:54px;height:54px;border-radius:14px;flex-shrink:0;box-shadow:0 4px 12px rgba(43,35,80,.25)}
.num-paso{flex-shrink:0;width:28px;height:28px;border-radius:50%;background:var(--tinta);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
.revisar{width:100%;display:flex;align-items:center;gap:12px;background:var(--teja);color:#fff;margin-bottom:14px;padding:14px 16px}
.guia-acceso{width:100%;display:flex;align-items:center;gap:12px;margin-bottom:14px}
.guia-paso h3{font-size:20px}
.guia-texto{margin-top:10px;font-size:15px;color:var(--tinta2)}
.guia-texto p{margin-top:8px}
.guia-texto ul,.guia-texto ol{margin:8px 0 0 20px}
.guia-texto li{margin-top:5px}
.guia-texto b{color:var(--tinta)}
.captura{display:block;width:100%;max-width:340px;margin:16px auto 2px;border-radius:18px;border:1px solid var(--linea);box-shadow:0 6px 18px rgba(43,35,80,.12)}
.proximos{margin-top:16px;padding-top:12px;border-top:1px solid rgba(243,210,122,.35);display:grid;gap:6px}
.prox{display:flex;gap:10px;font-size:14px;color:#F1EEF9;align-items:flex-start}
.prox b{color:#F3D27A}
.dia .num{display:flex;justify-content:space-between;align-items:flex-start}
.efe{color:var(--oro);font-size:13px;line-height:1}
.efe-fiesta{font-size:15px}
.efe-banda{background:#FBF3DC;border:1px solid #F0DDA4;border-radius:14px;padding:10px 14px;margin:8px 0 4px}
.efe-banda b{display:block;color:var(--tinta)}
.efe-banda span{display:block;font-size:14px;color:var(--tinta2);margin-top:2px}
.cal.esperando .barras i{animation:latido 1.2s ease-in-out infinite;background:var(--linea)}
@keyframes latido{50%{opacity:.35}}
.cal.desde-der{animation:desdeDer .22s ease-out}
.cal.desde-izq{animation:desdeIzq .22s ease-out}
@keyframes desdeDer{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes desdeIzq{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
.hero-alumno{padding-top:150px}
.hero-alumno .estado{font-size:30px}
.btn-oro{background:var(--oro);color:var(--tinta);margin-top:16px}
.destacado{background:linear-gradient(160deg,#FFFEFB 0%,#FBF3DC 100%);border:1px solid #F0DDA4}
.libro{display:flex;gap:14px;align-items:center;margin-top:12px}
.portada{width:58px;height:80px;flex-shrink:0;border-radius:6px 10px 10px 6px;background:linear-gradient(135deg,var(--tinta) 0%,#5A3E8A 100%);box-shadow:inset 5px 0 0 rgba(0,0,0,.25),0 4px 10px rgba(43,35,80,.25);display:grid;place-items:center}
.portada span{font-family:Fraunces,serif;font-size:28px;color:var(--oro);font-weight:700}
.libro h3{font-size:20px;line-height:1.15}
.libro .autor{font-size:14px;color:var(--tinta2);font-style:italic;margin-top:2px}
.cita{margin-top:12px;font-size:14px;color:var(--tinta2);font-style:italic;border-left:3px solid var(--oro);padding-left:12px}
.cita span{display:block;font-style:normal;font-size:12px;color:var(--suave);margin-top:4px}
.ranking{margin-top:10px}
.rk{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--linea)}
.rk:last-child{border-bottom:0}
.rk .med{width:30px;text-align:center;font-size:20px;font-weight:700;color:var(--suave)}
.rk:not(.top) .med{font-size:13px}
.rk .nom{flex:1;min-width:0}
.rk .nom b{display:block}
.rk .nom small{font-size:12px;color:var(--suave)}
.rk .pts{font-family:Fraunces,serif;font-size:22px;font-weight:700;color:var(--tinta);min-width:28px;text-align:right;line-height:1}
.rk .pts small{display:block;font-family:Inter,sans-serif;font-size:10px;font-weight:600;color:var(--suave);margin-top:3px}
.rk.top:first-child .pts{color:var(--oro)}
.franja-demo{position:sticky;top:calc(env(safe-area-inset-top) + 6px);z-index:25;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--oro);color:var(--tinta);border-radius:14px;padding:8px 8px 8px 14px;margin-bottom:14px;font-size:14px;box-shadow:0 6px 16px rgba(43,35,80,.18)}
.franja-demo button{background:var(--tinta);color:#fff;font-weight:700;font-size:13px;padding:7px 14px;border-radius:10px}
.tag-demo{background:var(--oro);color:var(--tinta);font-weight:700;padding:1px 7px;border-radius:6px}
.demo-card{border:1.5px dashed var(--oro)}
.ejemplo-card{border:1.5px dashed var(--cielo)}
sup{font-size:.6em;line-height:0;vertical-align:.6em;margin-left:.02em}
.enlace{display:block;margin:10px auto 0;color:var(--tinta);font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.equipo{margin-top:12px;padding:12px 14px;border-radius:16px;background:var(--papel);border:1.5px solid var(--linea)}
.equipo.ganador{background:#FBF3DC;border-color:#F0DDA4}
.filas-emoji{display:grid;grid-template-columns:repeat(6,30px);gap:2px 4px;font-size:22px;margin-top:8px;line-height:1.2}
.conf-velo{position:fixed;inset:0;z-index:70;background:rgba(25,18,48,.55);display:grid;place-items:center;padding:24px;opacity:0;pointer-events:none;transition:opacity .15s}
.conf-velo.on{opacity:1;pointer-events:auto}
.conf{background:var(--blanco);border-radius:24px;padding:24px 20px 20px;width:min(380px,100%);text-align:center;box-shadow:0 20px 50px rgba(25,18,48,.35);transform:scale(.95);transition:transform .15s}
.conf-velo.on .conf{transform:none}
.conf-icono{font-size:38px;line-height:1}
.conf h2{font-size:22px;margin-top:10px}
.conf p{color:var(--tinta2);margin-top:8px;font-size:15px}
.conf-botones{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.conf-botones .btn{margin:0;padding:15px 10px}
.btn.rojo{background:var(--teja);color:#fff}
.revisar.devuelto{background:var(--oro);color:var(--tinta)}
.nota-maestro{background:#FBF3DC;border:1px solid #F0DDA4;border-radius:14px;padding:12px 14px;margin:10px 0 4px}
.nota-maestro span{display:block;font-size:13px;color:var(--tinta2)}
.nota-maestro b{display:block;margin-top:2px;font-size:16px}
.corregido{margin-top:8px;font-size:13px;background:#E8F1FB;color:#24508A;border-radius:10px;padding:6px 10px}
.tres-botones{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.btn-peq.oro{background:var(--oro);color:var(--tinta)}
.pill.devuelto-p{background:#FBF3DC;color:#9A6B00}

<body>

</div></div>

<script>
/* ============ CONFIGURACIÓN ============ */
const API = 'https://script.google.com/macros/s/AKfycbz81OyJGv_nYIVvf2obFFmcTHuE472UoAX05WH8zrBownnmmddSbHULyt2vV2fO0F4u/exec';
const NOMBRE_CENTRO = 'CEIP Fernando IV';
const VERSION_APP = '1.33';

const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];

/* ============ ESTADO ============ */
const S = {
  vista: 'inicio',
  estado: null,          // respuesta de ?action=estado (mes actual + hoy)
  meses: {},             // caché de reservas por mes
  mesVista: null,
  publicas: null,
  pendientes: null,
  buzonTab: 'resenas',
  cal: { festivos: [], efemerides: [] },
  frescos: {},          // meses ya actualizados desde el servidor en esta sesión
  cargandoMes: {},   // calendario.json (festivos y efemérides)
  sesion: leer('bib_sesion'),
  demo: !!leer('bib_demo'),
  ejemplo: !!leer('bib_ejemplo'),
  demoMsgs: leer('bib_demoMsgs') || [],
  devueltos: [],
  abiertos: {},          // tarjetas plegables abiertas en esta sesión   // maestro: {token, maestro:{id,nombre,rol}}
  alumno: leer('bib_alumno')    // alumno: {codigoClase, alias}
};

function leer(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } }
function guardar(k,v){ try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }

/* ============ API ============ */
async function api(action, params = {}, post = false) {
  let r;
  if (post) r = await fetch(API, { method: 'POST', body: JSON.stringify(Object.assign({ action }, params)) });
  else r = await fetch(API + '?' + new URLSearchParams(Object.assign({ action }, params)));
  const j = await r.json();
  if (!j.ok) {
    if (/Sesión no válida/.test(j.error)) { S.sesion = null; guardar('bib_sesion', null); }
    throw new Error(j.error);
  }
  return j;
}

/* ============ UTILIDADES ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/^'/, '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dUTC = f => new Date(f + 'T12:00:00Z');
const diaSem = f => dUTC(f).getUTCDay();
const fechaLarga = f => { const d = dUTC(f); return `${DIAS[d.getUTCDay()]} ${d.getUTCDate()} de ${MESES[d.getUTCMonth()]}`; };
const fechaCorta = s => { if (!s) return ''; const [f] = s.split(' '); const d = dUTC(f); return `${d.getUTCDate()} ${MESES[d.getUTCMonth()].slice(0,3)}`; };
const mayus = t => t.charAt(0).toUpperCase() + t.slice(1);
/** Nombre de clase con «er» volado: 1.er ciclo → 1.<sup>er</sup> ciclo */
const cl = t => esc(t).replace(/(\d)\.er\b/g, '$1.<sup>er</sup>');
const estrellas = n => '★'.repeat(n) + '☆'.repeat(5 - n);
const iniciales = n => n.split(' ').filter(Boolean).slice(0,2).map(p => p[0].toUpperCase()).join('');
const esMaestro = () => !!(S.sesion && S.sesion.token) && !S.demo;
const hayMaestro = () => !!(S.sesion && S.sesion.token);
/* Modo demostración: un maestro usa la app como si fuera alumno. Lo que se envía no sale del dispositivo. */
const ALUMNO_DEMO = { codigoClase: 'DEMO', alias: 'Ejemplo', clase: 'Demostración' };
const alumno = () => S.demo ? ALUMNO_DEMO : S.alumno;
/** Lo publicado en el servidor + los ejemplos publicados en la demostración (solo en este dispositivo). */
function pub(){
  const base = S.publicas || { sugerencias: [], resenas: [], clases: [] };
  const demo = S.demoMsgs.filter(x => x.estado === 'aprobada').concat(conEjemplo() ? datosEjemplo() : []);
  const clases = (base.clases || []).slice();
  if (conEjemplo()) CLASES_EJEMPLO.forEach(([nombre, alumnos]) => { if (!clases.some(c => c.nombre === nombre)) clases.push({ nombre, alumnos }); });
  return { clases,
    sugerencias: demo.filter(x => x._t === 'sugerencia').concat(base.sugerencias).sort((a, b) => a.creada < b.creada ? 1 : -1),
    resenas: demo.filter(x => x._t === 'resena').concat(base.resenas).sort((a, b) => a.creada < b.creada ? 1 : -1) };
}

/* ---- Datos de ejemplo para presentaciones: solo en el dispositivo del administrador, nunca en el servidor ---- */
const conEjemplo = () => S.ejemplo && !!(S.sesion && S.sesion.maestro && S.sesion.maestro.rol === 'admin');
const CLASES_EJEMPLO = [['Infantil', 15], ['1.er ciclo', 6], ['2.º ciclo', 12], ['3.er ciclo', 6], ['ESO', 9], ['Aula específica', 5]];
function datosEjemplo(){
  if (!S.estado) return [];
  const hoy = S.estado.ahora.fecha, mes = hoy.slice(0, 7), dHoy = +hoy.slice(8, 10);
  const f = (d, h) => `${mes}-${String(Math.max(1, Math.min(d, dHoy))).padStart(2, '0')} ${h}`;
  const R = (id, d, alias, clase, libro, autor, v, texto) => ({ _t: 'resena', id: 'EJ' + id, ejemplo: true, tipoAutor: 'alumno', estado: 'aprobada', creada: f(d, '10:15'), alias, clase, libro, autorLibro: autor, valoracion: v, texto });
  const G = (id, d, alias, clase, titulo, texto) => ({ _t: 'sugerencia', id: 'EJ' + id, ejemplo: true, tipoAutor: 'alumno', estado: 'aprobada', creada: f(d, '12:30'), alias, clase, titulo, texto });
  return [
    R(1, 2, 'Lola', 'Infantil', 'El monstruo de colores', 'Anna Llenas', 5, 'Me gusta el monstruo cuando está contento y es amarillo.'),
    G(2, 6, 'Mateo', 'Infantil', 'Más cuentos con pegatinas', 'Nos gustan los libros con pegatinas y solapas.'),
    R(3, 9, 'Vega', 'Infantil', 'Elmer', 'David McKee', 5, 'Elmer es de muchos colores y es muy gracioso.'),
    R(4, 1, 'Hugo R.', '1.er ciclo', 'El principito', 'Antoine de Saint-Exupéry', 5, 'Me ha gustado mucho el zorro y la rosa. Es un libro muy bonito.'),
    R(5, 3, 'Alba M.', '1.er ciclo', 'Kika Superbruja', 'Knister', 4, 'Kika hace hechizos divertidos. Quiero leer el siguiente.'),
    G(6, 5, 'Hugo R.', '1.er ciclo', 'Una alfombra para leer', 'Podríamos tener una alfombra con cojines para leer en el suelo.'),
    R(7, 8, 'Pablo S.', '1.er ciclo', 'Fray Perico y su borrico', 'Juan Muñoz Martín', 4, 'El borrico es muy cabezota y me reí mucho.'),
    R(8, 11, 'Alba M.', '1.er ciclo', 'El principito', 'Antoine de Saint-Exupéry', 4, 'Al principio no lo entendía, pero luego me gustó.'),
    R(9, 1, 'Lucía G.', '2.º ciclo', 'Matilda', 'Roald Dahl', 5, 'Matilda es muy lista y valiente. La directora da miedo pero al final todo sale bien.'),
    R(10, 2, 'Daniel P.', '2.º ciclo', 'Manolito Gafotas', 'Elvira Lindo', 4, 'Manolito cuenta cosas de su barrio y de su abuelo. Es muy divertido.'),
    G(11, 4, 'Lucía G.', '2.º ciclo', 'Club de lectura', 'Podríamos quedar un día a la semana para hablar de los libros que leemos.'),
    R(12, 6, 'Irene L.', '2.º ciclo', 'El principito', 'Antoine de Saint-Exupéry', 5, 'Es un libro corto pero te hace pensar mucho. Lo recomiendo.'),
    R(13, 7, 'Marcos V.', '2.º ciclo', 'Las brujas', 'Roald Dahl', 4, 'Da un poco de miedo pero engancha. El final es muy original.'),
    G(14, 9, 'Daniel P.', '2.º ciclo', 'Libros de dinosaurios', 'Me gustaría que hubiera más libros de dinosaurios y de fósiles.'),
    R(15, 10, 'Irene L.', '2.º ciclo', 'Matilda', 'Roald Dahl', 5, 'Ya lo he leído dos veces. Me encanta cuando mueve las cosas con la mente.'),
    R(16, 12, 'Marcos V.', '2.º ciclo', 'Diario de Greg', 'Jeff Kinney', 4, 'Tiene muchos dibujos y se lee muy rápido.'),
    R(17, 1, 'Sara T.', '3.er ciclo', 'Wonder', 'R. J. Palacio', 5, 'Auggie es muy valiente. Este libro enseña a tratar bien a todo el mundo.'),
    R(18, 3, 'Iván C.', '3.er ciclo', 'Harry Potter y la piedra filosofal', 'J. K. Rowling', 5, 'Me lo he leído en una semana. Hogwarts es increíble.'),
    G(19, 4, 'Sara T.', '3.er ciclo', 'Más libros de misterio', 'Nos gustan mucho los libros de detectives y de misterio.'),
    R(20, 6, 'Noa B.', '3.er ciclo', 'El principito', 'Antoine de Saint-Exupéry', 5, 'Lo leímos en clase y nos hizo pensar sobre la amistad.'),
    R(21, 8, 'Iván C.', '3.er ciclo', 'Wonder', 'R. J. Palacio', 4, 'Me gustó que cada parte la cuente un personaje distinto.'),
    G(22, 11, 'Noa B.', '3.er ciclo', 'Concurso de marcapáginas', 'Podríamos hacer un concurso de marcapáginas para la biblioteca.'),
    R(23, 2, 'Javier M.', 'ESO', 'El curioso incidente del perro a medianoche', 'Mark Haddon', 4, 'Está contado por un chico que ve el mundo de forma diferente. Muy interesante.'),
    R(24, 5, 'Carla R.', 'ESO', 'Los juegos del hambre', 'Suzanne Collins', 5, 'No podía parar de leer. Katniss es una gran protagonista.'),
    G(25, 7, 'Javier M.', 'ESO', 'Sección de cómic y manga', 'Estaría bien tener una estantería solo de cómic y manga.'),
    R(26, 9, 'Lucas F.', 'ESO', 'La sombra del viento', 'Carlos Ruiz Zafón', 4, 'Es largo pero merece la pena. Barcelona parece un personaje más.'),
    R(27, 12, 'Carla R.', 'ESO', 'El principito', 'Antoine de Saint-Exupéry', 4, 'Lo leí de pequeña y ahora lo he entendido mucho mejor.'),
    R(28, 3, 'Rocío', 'Aula específica', 'Pictocuentos: Caperucita Roja', 'Adaptación con pictogramas', 5, 'Me gustan los dibujos y el lobo.'),
    G(29, 6, 'Adrián', 'Aula específica', 'Libros con sonidos', 'Queremos libros que hagan sonidos al tocarlos.'),
    R(30, 10, 'Rocío', 'Aula específica', 'Elmer', 'David McKee', 5, 'Elmer es mi favorito.')
  ];
}
function alternarEjemplo(){
  S.ejemplo = !S.ejemplo; guardar('bib_ejemplo', S.ejemplo || null); pintar();
  aviso(S.ejemplo ? 'Datos de ejemplo activados en este dispositivo' : 'Datos de ejemplo desactivados');
}
const esAdmin = () => esMaestro() && S.sesion.maestro.rol === 'admin';
function sumarDias(f, n){ const d = dUTC(f); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0,10); }
function ahoraCompleto(){ return S.estado ? S.estado.ahora.fecha + ' ' + S.estado.ahora.hora : ''; }

function aviso(msg, error){
  const a = $('#aviso'); a.textContent = msg; a.className = 'aviso on' + (error ? ' error' : '');
  clearTimeout(aviso.t); aviso.t = setTimeout(() => a.className = 'aviso', 3200);
}

function abrirHoja(html){ $('#hojaCont').innerHTML = html; $('#velo').classList.add('on'); $('#hoja').classList.add('on'); }
function cerrarHoja(){ $('#velo').classList.remove('on'); $('#hoja').classList.remove('on'); }
$('#velo').onclick = cerrarHoja;

/* ============ CARGA DE DATOS ============ */
async function cargarEstado(mes){
  const j = await api('estado', mes ? { mes } : {});
  if (!mes || !S.estado) S.estado = j;
  else S.estado.festivos = j.festivos;
  S.meses[j.mes] = j.reservas;
  S.frescos[j.mes] = true;
  if (!S.mesVista) S.mesVista = j.mes;
  guardarCache();
  return j;
}

/* ---- Caché local: la app se pinta al instante con lo último que sabía y se actualiza por detrás ---- */
function guardarCache(){
  if (!S.estado) return;
  guardar('bib_cache', { estado: S.estado, meses: S.meses, publicas: S.publicas, cal: S.cal, t: Date.now() });
}
function leerCache(){
  const c = leer('bib_cache');
  if (!c || !c.estado || Date.now() - c.t > 7 * 864e5) return;
  S.estado = c.estado; S.meses = c.meses || {}; S.publicas = c.publicas || null; S.cal = c.cal || S.cal;
  S.mesVista = null;
  actualizarReloj();
}
/** Fecha y hora de Madrid según el reloj del dispositivo (para no esperar al servidor). */
function ahoraCliente(){
  const p = {};
  new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Madrid', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false })
    .formatToParts(new Date()).forEach(x => p[x.type] = x.value);
  return { fecha: `${p.year}-${p.month}-${p.day}`, hora: `${p.hour === '24' ? '00' : p.hour}:${p.minute}` };
}
function actualizarReloj(){
  if (!S.estado) return;
  const a = ahoraCliente();
  const t = S.estado.tramos.find(x => a.hora >= x.inicio && a.hora < x.fin);
  S.estado.ahora = { fecha: a.fecha, hora: a.hora, tramoActual: t ? t.n : null };
  const mes = a.fecha.slice(0, 7);
  S.estado.mes = mes;
  if (S.meses[mes]) S.estado.hoy = S.meses[mes].filter(r => r.fecha === a.fecha);
  if (!S.mesVista) S.mesVista = mes;
}
/** Carga por detrás los dos meses siguientes para que el calendario no tenga que esperar. */
function precargarMeses(){
  if (!S.estado) return;
  let [y, m] = S.estado.ahora.fecha.slice(0, 7).split('-').map(Number);
  for (let i = 0; i < 2; i++) {
    m++; if (m > 12) { m = 1; y++; }
    const mes = `${y}-${String(m).padStart(2,'0')}`;
    if (!S.frescos[mes]) cargarEstado(mes).then(() => { if (S.vista === 'calendario') pintar(); }).catch(() => {});
  }
}
async function cargarCalendario(){
  try { const r = await fetch('calendario.json', { cache: 'no-store' }); if (r.ok) S.cal = await r.json(); } catch(e){}
}
async function cargarPublicas(){ S.publicas = await api('publicas'); guardarCache(); }
async function cargarPendientes(){ if (esMaestro()) S.pendientes = await api('pendientes', { token: S.sesion.token }, true).catch(() => null); }

/** Identificador anónimo de este dispositivo: sirve para devolver al alumno sus propios mensajes. */
function idDispositivo(){
  let id = leer('bib_dispositivo');
  if (!id) { id = (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2)); guardar('bib_dispositivo', id); }
  return id;
}
async function cargarDevueltos(){
  if (S.demo) { S.devueltos = S.demoMsgs.filter(x => x.estado === 'devuelta'); return; }
  if (esMaestro() || !S.alumno) { S.devueltos = []; return; }
  try { S.devueltos = (await api('misDevueltos', { dispositivo: idDispositivo(), alias: S.alumno.alias })).devueltos || []; }
  catch(e){ S.devueltos = S.devueltos || []; }
}

async function refrescar(){
  try {
    await Promise.all([cargarEstado(), cargarPublicas(), cargarPendientes(), cargarCalendario(), cargarDevueltos()]);
    if (S.mesVista && S.mesVista !== S.estado.mes) await cargarEstado(S.mesVista);
    guardarCache();
    pintar();
    precargarMeses();
  } catch(e){ aviso('Sin conexión con el servidor', true); }
}

/* ============ FESTIVOS Y EFEMÉRIDES ============ */
function listaFestivos(){
  const out = {};
  (S.cal.festivos || []).forEach(f => {
    const v = { motivo: f.motivo || 'Festivo', corto: f.corto || f.motivo || 'Festivo' };
    if (f.fecha) out[f.fecha] = v;
    else if (f.desde && f.hasta) for (let d = f.desde; d <= f.hasta; d = sumarDias(d, 1)) out[d] = v;
  });
  (S.estado ? S.estado.festivos : []).forEach(f => { if (!out[f.fecha]) out[f.fecha] = { motivo: f.motivo, corto: f.motivo }; });
  return out;
}
const festivoDe = f => { const m = listaFestivos()[f]; return m ? { fecha: f, motivo: m.motivo, corto: m.corto } : null; };
const efemeridesDe = f => (S.cal.efemerides || []).filter(e => e.fecha === f);

function diasEntre(a, b){ return Math.round((dUTC(b) - dUTC(a)) / 86400000); }
function cuandoEs(f){
  const n = diasEntre(S.estado.ahora.fecha, f);
  if (n === 0) return 'Hoy';
  if (n === 1) return 'Mañana';
  const d = dUTC(f); return `El ${DIAS[d.getUTCDay()]} ${d.getUTCDate()}`;
}
/** Lo que llega en los próximos 3 días: efemérides y comienzo de festivos o vacaciones. */
function proximos(){
  const hoy = S.estado.ahora.fecha, lim = sumarDias(hoy, 3), out = [];
  (S.cal.efemerides || []).forEach(e => { if (e.fecha >= hoy && e.fecha <= lim) out.push({ fecha: e.fecha, icono: e.icono || '✨', texto: e.titulo }); });
  (S.cal.festivos || []).forEach(f => {
    const ini = f.fecha || f.desde;
    if (!ini) return;
    if (ini >= hoy && ini <= lim) out.push({ fecha: ini, icono: '🎈', texto: f.desde ? `${f.motivo || 'Vacaciones'} (hasta el ${dUTC(f.hasta).getUTCDate()} de ${MESES[dUTC(f.hasta).getUTCMonth()]})` : `No hay clase · ${f.motivo || 'Festivo'}` });
  });
  return out.sort((a, b) => a.fecha < b.fecha ? -1 : 1).slice(0, 3);
}

/* ============ NAVEGACIÓN ============ */
document.querySelectorAll('#tabbar button').forEach(b => b.onclick = () => ir(b.dataset.v));
function ir(v){ S.vista = v; window.scrollTo(0,0); pintar(); }

function pintar(){
  const prof = esMaestro();
  if (!prof && S.vista === 'calendario') S.vista = 'inicio';

function situacionAhora(){
  const { ahora, tramos, hoy } = S.estado;
  const ds = diaSem(ahora.fecha);
  const fest = festivoDe(ahora.fecha);
  if (ds === 0 || ds === 6) return { estado: 'Cerrada', det: 'Hoy no hay clase.', clase: 'neutra', lectivo: false };
  if (fest) return { estado: 'Cerrada', det: fest.motivo || 'Día no lectivo.', clase: 'neutra', lectivo: false };
  if (ahora.tramoActual) {
    const r = hoy.find(x => x.tramo === ahora.tramoActual);
    const t = tramos[ahora.tramoActual - 1];
    return r ? { estado: 'Ocupada', det: `${r.maestro} · ${r.grupo} · hasta las ${t.fin}`, clase: 'ocupada', lectivo: true }
             : { estado: 'Libre', det: `Libre hasta las ${t.fin}`, clase: 'libre', lectivo: true };
  }
  if (ahora.hora < tramos[0].inicio) return { estado: 'Aún cerrada', det: 'La jornada empieza a las 9:30.', clase: 'neutra', lectivo: true };
  if (ahora.hora >= tramos[3].fin) return { estado: 'Cerrada', det: 'La jornada ha terminado.', clase: 'neutra', lectivo: true };
  return { estado: 'Recreo', det: 'Se reanuda a las 12:00.', clase: 'neutra', lectivo: true };
}

/* ============ INICIO DEL ALUMNADO ============ */
const norm = t => String(t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();

/** Libro del mes: más reseñas y, a igualdad, mejor media. Si no hay este mes, el mejor del curso. */
function libroDestacado(){
  const todas = pub().resenas;
  const mes = S.estado.ahora.fecha.slice(0, 7);
  const agrupar = lista => {
    const g = {};
    lista.forEach(r => {
      const k = norm(r.libro);
      const x = g[k] || (g[k] = { libro: r.libro, autor: r.autorLibro, n: 0, suma: 0, mejor: null });
      x.n++; x.suma += +r.valoracion;
      if (!x.mejor || +r.valoracion > +x.mejor.valoracion || (+r.valoracion === +x.mejor.valoracion && r.texto.length > x.mejor.texto.length)) x.mejor = r;
    });
    return Object.values(g).sort((a, b) => b.n - a.n || b.suma / b.n - a.suma / a.n)[0];
  };
  const delMes = agrupar(todas.filter(r => (r.creada || '').slice(0, 7) === mes));
  if (delMes) return Object.assign(delMes, { titulo: 'Libro del mes' });
  const delCurso = agrupar(todas);
  return delCurso ? Object.assign(delCurso, { titulo: 'Libro mejor valorado' }) : null;
}

/** Ranking de clases del mes: publicaciones por alumno (solo cuenta lo publicado). */
function ranking(limite = 50){
  const mes = S.estado.ahora.fecha.slice(0, 7);
  const p = pub();
  const tam = {}; (p.clases || []).forEach(c => tam[norm(c.nombre)] = c.alumnos);
  const g = {};
  p.sugerencias.concat(p.resenas)
    .filter(x => x.tipoAutor === 'alumno' && x.clase && (x.creada || '').slice(0, 7) === mes)
    .forEach(x => {
      const k = norm(x.clase);
      const r = g[k] || (g[k] = { nombre: x.clase, n: 0, alumnos: tam[k] || 0 });
      r.n++;
    });
  return Object.values(g).filter(r => r.alumnos > 0)
    .map(r => Object.assign(r, { media: r.n / r.alumnos }))
    .sort((a, b) => b.media - a.media || b.n - a.n).slice(0, limite);
}

function tarjetaLibro(libro){
  return `<div class="card destacado">
    <div class="fila"><div class="etq">⭐ ${libro ? libro.titulo : 'Libro del mes'}</div>${libro ? `<span class="ayuda">${libro.n === 1 ? '1 reseña' : libro.n + ' reseñas'}</span>` : ''}</div>
    ${libro ? `<div class="libro">
        <div class="portada"><span>${esc(libro.libro.replace(/^(el|la|los|las|un|una|unos|unas)\s+/i, '').slice(0, 1).toUpperCase())}</span></div>

          ${libro.autor && libro.autor !== '-' ? `<p class="autor">${esc(libro.autor)}</p>` : ''}
          <div class="estrellas" style="font-size:18px">${estrellas(Math.round(libro.suma / libro.n))} <small class="ayuda">${(libro.suma / libro.n).toFixed(1).replace('.', ',')}</small></div></div>
      </div>
      <p class="cita">«${esc(libro.mejor.texto.length > 140 ? libro.mejor.texto.slice(0, 137) + '…' : libro.mejor.texto)}»<span>— ${esc(libro.mejor.alias)}, ${cl(libro.mejor.clase)}</span></p>`
    : '<p class="ayuda" style="margin-top:8px">Aún no hay reseñas. ¡Escribe la primera!</p>'}

function tarjetaRanking(rk, mesNombre, profesorado){

        <span class="med">${medallas[i] || (i + 1) + '.º'}</span>

      <p class="ayuda" style="margin-top:10px">Gana la clase con más reseñas y sugerencias publicadas por alumno este mes, así las clases pequeñas compiten igual.${profesorado ? ' Las clases sin número de alumnos no aparecen.' : ''}</p>

/* ============ CALENDARIO ============ */
function vCalendario(){
  const [y, m] = S.mesVista.split('-').map(Number);
  const reservas = S.meses[S.mesVista];
  let celdas = ['L','M','X','J','V'].map(d => `<div class="dsem">${d}</div>`).join('');
  if (!S.frescos[S.mesVista] && !S.cargandoMes[S.mesVista]) {
    const mes = S.mesVista; S.cargandoMes[mes] = true;
    cargarEstado(mes).then(() => { if (S.vista === 'calendario') pintar(); })
      .catch(() => { if (!reservas) aviso('No se pudo cargar el mes', true); })
      .finally(() => { delete S.cargandoMes[mes]; });
  }
  const esperando = !reservas;
  const dias = new Date(Date.UTC(y, m, 0)).getUTCDate();
  let primero = true;
  for (let d = 1; d <= dias; d++) {
    const f = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const ds = diaSem(f);
    if (ds === 0 || ds === 6) continue;
    if (primero) { for (let i = 1; i < ds; i++) celdas += '<div class="dia vacio"></div>'; primero = false; }
    const fest = festivoDe(f);
    const efe = efemeridesDe(f);
    const delDia = (reservas || []).filter(r => r.fecha === f);
    const barras = [1,2,3,4].map(n => `<i class="${delDia.some(r => r.tramo === n) ? 'o' : ''}"></i>`).join('');
    const cls = ['dia', f === S.estado.ahora.fecha ? 'hoy' : '', f < S.estado.ahora.fecha ? 'pasado' : '', fest ? 'fest' : ''].join(' ');
    celdas += `<button class="${cls}" onclick="abrirDia('${f}')"><span class="num">${d}${efe.length ? (efe.some(e => e.festiva) ? `<span class="efe efe-fiesta">${esc(efe.find(e => e.festiva).icono || '🎉')}</span>` : '<span class="efe">★</span>') : ''}</span>
      ${fest ? `<span class="fl">${esc(fest.corto)}</span>` : `<span class="barras">${barras}</span>`}</button>`;
  }
  return cabecera('Reservas') + navMes(y, m) + `<div class="cal${esperando ? ' esperando' : ''}">${celdas}</div>
    <div class="leyenda"><span><i style="background:#C9E7D2"></i>Libre</span><span><i style="background:var(--teja)"></i>Reservada</span><span><b style="color:var(--oro)">★</b> Efeméride</span></div>
    <p class="ayuda" style="text-align:center;margin-top:14px">Cada barra es una sesión: 9:30 · 10:30 · 12:00 · 13:00<br>Desliza el dedo a los lados para cambiar de mes.</p>
    ${!esMaestro() ? '<p class="ayuda" style="text-align:center">Solo el profesorado puede reservar.</p>' : ''}`;
}

function navMes(y, m){
  return `<div class="mesnav"><button class="redondo" onclick="cambiarMes(-1)">‹</button>
    <h2>${mayus(MESES[m-1])} ${y}</h2><button class="redondo" onclick="cambiarMes(1)">›</button></div>`;
}
function cambiarMes(delta){
  let [y, m] = S.mesVista.split('-').map(Number);
  m += delta; if (m < 1) { m = 12; y--; } if (m > 12) { m = 1; y++; }
  S.mesVista = `${y}-${String(m).padStart(2,'0')}`; pintar();
  const cal = document.querySelector('.cal'); if (cal) cal.classList.add(delta > 0 ? 'desde-der' : 'desde-izq');
}

/* Deslizar el dedo a izquierda o derecha para cambiar de mes */
(() => {
  let x0 = null, y0 = null, t0 = 0;
  document.addEventListener('touchstart', e => {
    if (S.vista !== 'calendario' || e.touches.length !== 1 || $('#hoja').classList.contains('on')) { x0 = null; return; }
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; t0 = Date.now();
  }, { passive: true });
  document.addEventListener('touchend', e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    x0 = null;
    if (Date.now() - t0 < 600 && Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) cambiarMes(dx < 0 ? 1 : -1);
  }, { passive: true });
})();

/* Sin zoom al pellizcar ni con doble toque (también en iPhone, que ignora la etiqueta viewport) */
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });

function abrirDia(f){
  if (!S.meses[f.slice(0,7)]) { aviso('Cargando las reservas de ese mes…'); return; }
  const reservas = (S.meses[f.slice(0,7)] || []).filter(r => r.fecha === f);
  const fest = festivoDe(f);
  const efes = efemeridesDe(f);
  const ahora = ahoraCompleto();
  const limite = sumarDias(S.estado.ahora.fecha, S.estado.diasAntelacion);
  let cuerpo;
  if (fest) cuerpo = `<p class="ayuda" style="font-size:15px">No hay clase: ${esc(fest.motivo || 'festivo')}.</p>`;
  else cuerpo = S.estado.tramos.map(t => {
    const r = reservas.find(x => x.tramo === t.n);
    const pasado = (f + ' ' + t.fin) <= ahora;
    let accion = '';
    if (r) {
      const puede = esMaestro() && !pasado && (r.maestroId === S.sesion.maestro.id || esAdmin());
      if (puede) accion = `<button class="btn-peq peligro" onclick="anular('${r.id}','${f}')">Anular</button>`;
      return `<div class="tramo-fila"><div class="hora">${t.inicio}<small>${t.fin}</small></div>
        <div class="info"><b>${esc(r.maestro)}</b><span>${cl(r.grupo)}</span></div>${accion}</div>`;
    }
    if (esMaestro() && !pasado && f <= limite)
      accion = `<button class="btn-peq" onclick="mostrarReserva(${t.n})">Reservar</button>`;
    return `<div class="tramo-fila"><div class="hora">${t.inicio}<small>${t.fin}</small></div>
      <div class="info"><span class="pill libre" style="${pasado ? 'opacity:.5' : ''}"><span class="punto"></span>Libre</span>
      <div id="ch${t.n}" class="chips" style="display:none"></div>
      <div class="reservar-form" id="rf${t.n}" style="display:none">
        <input id="gr${t.n}" maxlength="40" placeholder="Grupo o motivo (p. ej. 4.º A)">
        <button class="btn-peq" onclick="reservar('${f}',${t.n},this)">OK</button></div></div>
      <span id="rb${t.n}">${accion}</span></div>`;

async function reservar(f, n, btn){
  const grupo = $('#gr' + n).value.trim();
  if (!grupo) { aviso('Indica el grupo o el motivo', true); return; }
  btn.disabled = true; btn.textContent = '…';
  try {

    guardar('bib_ultimoGrupo', grupo);
    aviso('Reserva hecha ✓');
  } catch(e){ aviso(e.message, true); }
  await recargarMes(f); abrirDia(f);
}

async function anular(id, f){
  const r = (S.meses[f.slice(0,7)] || []).find(x => x.id === id);
  const t = r ? S.estado.tramos[r.tramo - 1] : null;
  if (!(await confirmar({ titulo: '¿Anular la reserva?', texto: r ? `${mayus(fechaLarga(f))}, de ${t.inicio} a ${t.fin}<br><b>${cl(r.grupo)}</b>` : '', boton: 'Sí, anular', icono: '📅' }))) return;
  try { await api('anular', { token: S.sesion.token, id }, true); aviso('Reserva anulada'); }
  catch(e){ aviso(e.message, true); }
  await recargarMes(f); abrirDia(f);
}
// Doble pulsación en lugar de confirm() para no bloquear la app.
/** Ventana de confirmación con dos botones claros. Devuelve true si se confirma. */
function confirmar({ titulo, texto = '', boton = 'Confirmar', icono = '⚠️', peligro = true }){
  return new Promise(resolver => {
    $('#confIcono').textContent = icono; $('#confTitulo').innerHTML = titulo; $('#confTexto').innerHTML = texto;
    const si = $('#confSi'), no = $('#confNo'), velo = $('#confVelo');
    si.textContent = boton; si.className = 'btn' + (peligro ? ' rojo' : '');
    const cerrar = r => { velo.classList.remove('on'); si.onclick = no.onclick = velo.onclick = null; resolver(r); };
    si.onclick = () => cerrar(true); no.onclick = () => cerrar(false);
    velo.onclick = e => { if (e.target === velo) cerrar(false); };
    velo.classList.add('on');
  });
}

async function enviarMensaje(res, reenviarId){
  const quien = esMaestro() ? { token: S.sesion.token } : { codigoClase: alumno().codigoClase, alias: alumno().alias, dispositivo: idDispositivo() };
  if (reenviarId) quien.reenviarId = reenviarId;
  const datos = res
    ? { libro: $('#fLibro').value, autorLibro: $('#fAutor').value.trim() || '-', valoracion: ponerEstrellas.n, texto: $('#fTexto').value }
    : { titulo: $('#fTitulo').value, texto: $('#fTexto').value };
  if (res && !ponerEstrellas.n) { aviso('Elige las estrellas', true); return; }
  if (S.demo) {
    const falta = res ? (!datos.libro.trim() ? 'título del libro' : !datos.texto.trim() ? 'reseña' : '') : (!datos.titulo.trim() ? 'título' : !datos.texto.trim() ? 'texto' : '');
    if (falta) { aviso('Falta el campo «' + falta + '».', true); return; }
    const previo = reenviarId && S.demoMsgs.find(x => x.id === reenviarId);
    if (previo) Object.assign(previo, datos, { estado: 'pendiente', revisiones: (previo.revisiones || 0) + 1 });
    else S.demoMsgs.unshift(Object.assign({ _t: res ? 'resena' : 'sugerencia', id: 'DEMO' + Date.now(), demo: true, estado: 'pendiente', tipoAutor: 'alumno',
      alias: ALUMNO_DEMO.alias, clase: ALUMNO_DEMO.clase, creada: S.estado.ahora.fecha + ' ' + S.estado.ahora.hora }, datos));
    await cargarDevueltos();
    guardar('bib_demoMsgs', S.demoMsgs); cerrarHoja();
    aviso('¡Enviado! Se publicará cuando lo revisen ✓'); pintar(); return;
  }
  const b = $('#fEnviar'); b.disabled = true; b.textContent = 'Enviando…';
  try {
    const j = await api(res ? 'enviarResena' : 'enviarSugerencia', Object.assign(quien, datos), true);
    cerrarHoja();
    aviso(j.estado === 'aprobada' ? 'Publicado ✓' : reenviarId ? '¡Corregido y enviado! ✓' : '¡Enviado! Se publicará cuando lo revisen ✓');
    await Promise.all([cargarPublicas(), cargarDevueltos()]); pintar();
  } catch(e){ aviso(e.message, true); b.disabled = false; b.textContent = reenviarId ? 'Volver a enviar' : 'Enviar'; if (/ya no se puede corregir/.test(e.message)) { await cargarDevueltos(); pintar(); } }
}

  const items = a.mensajes || [];
  abrirHoja(`<h2>${esc(a.alias)}</h2>

    <button class="btn" onclick="cerrarHoja()">Cerrar</button>`);
}

  return `<p class="ayuda">Código de centro (dáselo a los docentes para que se den de alta):</p>
    <div class="fila" style="margin-top:8px"><span class="codigo" style="font-size:18px">${esc(S.admin.codigoCentro)}</span>
      <button class="btn-peq sec" onclick="cambiarCodigoCentro()">Cambiar</button></div>

          <button class="btn-peq sec ajusta" onclick="cambiarRol('${x.id}','${x.rol === 'admin' ? 'maestro' : 'admin'}')">${x.rol === 'admin' ? 'Quitar admin' : 'Hacer admin'}</button>
          <button class="btn-peq peligro ajusta" onclick="bajaMaestro('${x.id}')">Dar de baja</button></div>`}
      </div>`).join('')}`;

async function cargarAdmin(){
  try { S.admin = await api('adminInfo', { token: S.sesion.token }, true); }
  catch(e){ S.admin = { error: /desconocida/.test(e.message) ? 'Falta actualizar el servidor en Google Apps Script.' : e.message }; }
  if (S.vista === 'perfil') pintar();
}
const nombreMaestro = id => { const m = S.admin && S.admin.maestros && S.admin.maestros.find(x => x.id === id); return m ? esc(m.nombre) : 'este maestro'; };
async function accionAdmin(accion, datos, opciones){
  if (opciones && !(await confirmar(opciones))) return null;
  try { const j = await api(accion, Object.assign({ token: S.sesion.token }, datos), true); await cargarAdmin(); return j; }
  catch(e){ aviso(e.message, true); return null; }
}
async function cambiarCodigoCentro(){ const j = await accionAdmin('cambiarCodigoCentro', {}, { titulo: '¿Cambiar el código de centro?', texto: 'El código actual dejará de servir para darse de alta. Los maestros ya registrados no se ven afectados.', boton: 'Sí, cambiar', icono: '🔑' }); if (j) aviso('Nuevo código: ' + j.codigoCentro); }
async function cambiarRol(id, rol){ const j = await accionAdmin('cambiarRol', { id, rol }, rol === 'admin' ? { titulo: `¿Hacer administrador a ${nombreMaestro(id)}?`, texto: 'Podrá gestionar maestros, claves y el código de centro.', boton: 'Sí, hacerlo admin', icono: '⭐', peligro: false } : { titulo: `¿Quitar el papel de administrador a ${nombreMaestro(id)}?`, texto: 'Seguirá siendo maestro/a.', boton: 'Sí, quitar', icono: '⭐' }); if (j) aviso(rol === 'admin' ? 'Ahora es administrador' : 'Ya no es administrador'); }
async function bajaMaestro(id){ const j = await accionAdmin('bajaMaestro', { id }, { titulo: `¿Dar de baja a ${nombreMaestro(id)}?`, texto: 'Ya no podrá entrar en la app. Sus reservas ya hechas se mantienen.', boton: 'Sí, dar de baja', icono: '👤' }); if (j) aviso(j.baja + ' dado de baja'); }
async function restablecerClave(id){

/* ---- Tarjetas plegables (cerradas por defecto) ---- */
function plegable(clave, titulo, resumen, contenido, interior){
  const abierto = !!S.abiertos[clave];
  return `<div class="${interior ? 'pleg-int' : 'card'} plegable${abierto ? ' abierto' : ''}">
    <button class="pleg-cab" onclick="plegar('${clave}')" aria-expanded="${abierto}">
      <span class="pleg-txt"><b>${titulo}</b><span class="ayuda">${resumen}</span></span>
      <span class="pleg-flecha">›</span></button>
    ${abierto ? `<div class="pleg-cuerpo">${contenido}</div>` : ''}</div>`;
}
function plegar(clave){ S.abiertos[clave] = !S.abiertos[clave]; pintar(); }
function resumenMisClases(){
  if (!S.clases) return 'Cargando…';
  const mias = S.clases.filter(c => c.mia).map(c => cl(c.nombre));
  return mias.length ? mias.join(' · ') : 'Aún no has marcado ninguna';
}
function resumenAlumnado(){
  if (!S.clases) return 'Cargando…';
  const n = S.clases.reduce((t, c) => t + (c.participantes || []).length, 0);
  return `${S.clases.length} clases · ${n === 1 ? '1 alumno/a ha participado' : n + ' alumnos/as han participado'}`;
}

/** Una clase con su código, número de alumnos y alumnado participante. */
function filaClase(c){
  const part = c.participantes || [];
  const lista = part.length
    ? `<div class="part"><div class="ayuda">${part.length === 1 ? 'Ha participado 1 alumno/a' : `Han participado ${part.length} alumnos/as`}. Toca un nombre para ver lo que ha escrito.</div>
        <div class="chips">${part.map((a, i) => `<button class="chip" onclick="verAlumno('${esc(c.codigo || c.nombre)}',${i})">${esc(a.alias)} <small>${a.envios}</small></button>`).join('')}</div></div>`
    : '<div class="part ayuda">Aún no ha escrito nadie de esta clase.</div>';
  return `<div style="padding:12px 0;border-top:1px solid var(--linea)">
    <div class="fila"><b>${cl(c.nombre)}</b><button class="ayuda num-al nowrap" onclick="formAlumnos('${esc(c.codigo)}')">${c.alumnos || '¿?'} alumnos ✏️</button></div>
    <div class="fila" style="margin-top:8px"><span class="codigo">${esc(c.codigo)}</span>
      <button class="btn-peq sec nowrap" onclick="cambiarCodigoClase('${esc(c.nombre)}')">Cambiar código</button></div>
    ${lista}</div>`;
}

/** Administración → Alumnado: todas las clases del centro y los códigos antiguos. */
function pintarAlumnado(){
  if (!S.clases) return '<p class="ayuda">Cargando…</p>';
  const antiguas = S.clasesAntiguas || [];
  return `<p class="ayuda">Todas las clases del centro, con su código y el alumnado que ha participado.</p>
    ${S.clases.map(filaClase).join('')}
    ${antiguas.length ? `<div class="linea"></div><p class="etq">Códigos antiguos</p><p class="ayuda" style="margin-top:4px">Ya no funcionan. Elimínalos para que sus mensajes de prueba no cuenten.</p>
      ${antiguas.map(c => `<div class="fila clase-off" style="padding:10px 0;border-bottom:1px solid var(--linea)"><div><b>${cl(c.nombre)}</b><div style="margin-top:4px"><span class="codigo">${esc(c.codigo)}</span>
        <span class="ayuda">${(n => n === 1 ? '1 mensaje' : n + ' mensajes')(c.participantes.reduce((t, a) => t + a.envios, 0))}</span></div></div>
        <button class="btn-peq peligro" style="opacity:1" onclick="eliminarClase('${esc(c.codigo)}')">Eliminar</button></div>`).join('')}` : ''}`;
}

function pintarClases(){
  if (!S.clases) return '<p class="ayuda">Cargando…</p>';
  if (S.clases.length && S.clases[0].mia === undefined) return '<p class="ayuda">Falta actualizar el servidor en Google Apps Script.</p>';
  const selector = `<div class="chips selector">${S.clases.map(c => `<button class="chip${c.mia ? ' on' : ''}" onclick="alternarClase('${esc(c.nombre)}')">${c.mia ? '✓ ' : ''}${cl(c.nombre)}</button>`).join('')}</div>`;
  const mias = S.clases.filter(c => c.mia);
  return selector
    + (mias.length ? `<p class="ayuda" style="margin:14px 0 2px">Da a cada clase su código para que el alumnado pueda escribir. Si un código se difunde fuera de clase, pulsa «Cambiar código».</p>${mias.map(filaClase).join('')}` : '<p class="ayuda" style="margin-top:12px">Toca arriba las clases en las que das clase.</p>');
}
async function alternarClase(nombre){
  const elegidas = S.clases.filter(c => c.nombre === nombre ? !c.mia : c.mia).map(c => c.nombre);
  S.clases.forEach(c => { if (c.nombre === nombre) c.mia = !c.mia; });
  const el = $('#clases'); if (el) el.innerHTML = pintarClases();
  try { await api('misClases', { token: S.sesion.token, clases: elegidas }, true); await Promise.all([cargarClases(), cargarPendientes()]); pintar(); }
  catch(e){ aviso(e.message, true); await cargarClases(); }
}
async function cambiarCodigoClase(nombre){
  if (!(await confirmar({ titulo: `¿Cambiar el código de ${cl(nombre)}?`, texto: 'El código actual dejará de funcionar. Tendrás que dar el nuevo a tu alumnado.', boton: 'Sí, cambiar', icono: '🔑' }))) return;
  try { const j = await api('cambiarCodigoClase', { token: S.sesion.token, nombre }, true); aviso('Nuevo código: ' + j.codigo); await cargarClases(); }
  catch(e){ aviso(e.message, true); }
}
function formAlumnos(codigo){
  const c = S.clases.find(x => x.codigo === codigo);
  abrirHoja(`<h2>${cl(c.nombre)}</h2><p class="ayuda">¿Cuántos alumnos tiene esta clase? Sirve para que el ranking sea justo con las clases pequeñas.</p>
    <label>Número de alumnos</label><input id="fAl" type="number" inputmode="numeric" min="1" max="60" value="${c.alumnos || ''}">
    <button class="btn" onclick="guardarAlumnos('${codigo}', this)">Guardar</button>`);
  setTimeout(() => $('#fAl').focus(), 250);
}
async function guardarAlumnos(codigo, b){
  const alumnos = +$('#fAl').value; if (!(alumnos >= 1 && alumnos <= 60)) { aviso('Escribe un número entre 1 y 60', true); return; }
  b.disabled = true;
  try { await api('alumnosClase', { token: S.sesion.token, codigo, alumnos }, true); cerrarHoja(); aviso('Guardado ✓'); await cargarClases(); }
  catch(e){ aviso(/desconocida/.test(e.message) ? 'Falta actualizar el servidor' : e.message, true); b.disabled = false; }
}
async function cargarClases(){
  if (!esMaestro()) return;
  try { const j = await api('listarClases', { token: S.sesion.token }); S.clases = j.clases; S.clasesAntiguas = j.antiguas || []; } catch(e){ S.clases = []; }
  if (S.vista === 'perfil') { pintar(); return; }
  const el = $('#clases'); if (el) el.innerHTML = pintarClases();
}
async function eliminarClase(codigo){
  const c = (S.clasesAntiguas || []).find(x => x.codigo === codigo);
  const n = c && c.participantes ? c.participantes.reduce((t, a) => t + a.envios, 0) : 0;
  if (!(await confirmar({ titulo: '¿Eliminar este código antiguo?', texto: n ? `Se borrará para siempre junto con sus <b>${n} mensajes</b>.` : 'Se borrará para siempre.', boton: 'Sí, eliminar', icono: '🗑️' }))) return;
  try { const j = await api('eliminarClase', { token: S.sesion.token, codigo }, true);
    aviso(j.borrados ? `Clase eliminada con sus ${j.borrados} mensajes` : 'Clase eliminada');
    await Promise.all([cargarClases(), cargarPublicas(), cargarPendientes()]); pintar(); }
  catch(e){ aviso(/desconocida/.test(e.message) ? 'Falta actualizar el servidor' : e.message, true); }
}
async function retirarPublicacion(tipo, id){
  if (!(await confirmar({ titulo: '¿Retirar esta publicación?', texto: 'Dejará de verse y de contar en el libro del mes y el ranking.', boton: 'Sí, retirar', icono: '📭' }))) return;
  try { await api('retirar', { token: S.sesion.token, tipo, id }, true); cerrarHoja(); aviso('Publicación retirada');
    await cargarPublicas(); pintar(); }
  catch(e){ aviso(/desconocida/.test(e.message) ? 'Falta actualizar el servidor' : e.message, true); }
}
const FRASES_DEVOLVER = [
  'Revisa la ortografía y vuelve a enviarlo.',
  'Cuéntanos un poco más.',
  'Escríbelo con tus propias palabras.'
];
function formDevolver(tipo, id){
  const p = S.pendientes || { sugerencias: [], resenas: [] };
  const x = S.demoMsgs.find(m => m.id === id) || p.sugerencias.concat(p.resenas).find(m => m.id === id) || {};
  const res = tipo === 'resena';
  abrirHoja(`<h2>Revisar el mensaje</h2>
    <div class="seg" style="margin:12px 0 4px">
      <button class="on" id="tAl" onclick="modoDevolver('alumno')">Lo corrige el alumno</button>
      <button id="tYo" onclick="modoDevolver('yo')">Lo corrijo yo</button></div>
    <div id="mAlumno">
      <p class="ayuda" style="margin-top:8px">El alumno verá este mensaje en su app, podrá corregirlo y volver a enviarlo.</p>
      <div class="chips" style="margin-top:12px">${FRASES_DEVOLVER.map(f => `<button class="chip" onclick="$('#dNota').value=this.textContent;document.querySelectorAll('#hoja .chips .chip').forEach(c=>c.classList.toggle('on',c===this))">${f}</button>`).join('')}</div>
      <label>Mensaje para el alumno</label><textarea id="dNota" maxlength="200" style="min-height:80px">${FRASES_DEVOLVER[0]}</textarea>
      <button class="btn" id="dBtn" onclick="devolver('${tipo}','${id}')">Devolver al alumno</button>
    </div>
    <div id="mYo" style="display:none">
      <p class="ayuda" style="margin-top:8px">Corrige el texto y publícalo. Úsalo para erratas pequeñas o con alumnado que no puede corregir solo. El original queda guardado.</p>
      ${res ? `<label>Título del libro</label><input id="eLibro" maxlength="100" value="${esc(x.libro || '')}">
        <label>Autor o autora</label><input id="eAutor" maxlength="80" value="${esc(x.autorLibro && x.autorLibro !== '-' ? x.autorLibro : '')}">`
      : `<label>Título</label><input id="eTitulo" maxlength="80" value="${esc(x.titulo || '')}">`}
      <label>${res ? 'Opinión' : 'Sugerencia'}</label><textarea id="eTexto" maxlength="1000">${esc(x.texto || '')}</textarea>
      <button class="btn" id="eBtn" onclick="guardarEdicion('${tipo}','${id}')">Guardar y publicar</button>
    </div>`);
}
function modoDevolver(m){
  $('#tAl').classList.toggle('on', m === 'alumno'); $('#tYo').classList.toggle('on', m === 'yo');
  $('#mAlumno').style.display = m === 'alumno' ? '' : 'none'; $('#mYo').style.display = m === 'yo' ? '' : 'none';
}
async function guardarEdicion(tipo, id){
  const res = tipo === 'resena';
  const edicion = res ? { libro: $('#eLibro').value.trim(), autorLibro: $('#eAutor').value.trim() || '-', texto: $('#eTexto').value.trim() }
                      : { titulo: $('#eTitulo').value.trim(), texto: $('#eTexto').value.trim() };
  if (!edicion.texto || !(res ? edicion.libro : edicion.titulo)) { aviso('No dejes campos vacíos', true); return; }
  $('#eBtn').disabled = true;
  await moderar(tipo, id, 'aprobada', null, edicion); cerrarHoja();
}
async function devolver(tipo, id){
  const nota = $('#dNota').value.trim(); if (!nota) { aviso('Escribe qué tiene que revisar', true); return; }
  $('#dBtn').disabled = true;
  await moderar(tipo, id, 'devuelta', nota); cerrarHoja();
}

async function moderar(tipo, id, decision, nota, edicion){
  const textos = { aprobada: edicion ? 'Corregido y publicado ✓' : 'Publicado ✓', rechazada: 'Descartado', devuelta: 'Devuelto al alumno ✓' };
  if (String(id).startsWith('DEMO')) {
    const m = S.demoMsgs.find(x => x.id === id);
    if (m) { m.estado = decision; if (nota) { m.nota = nota; m.moderadaPor = S.sesion.maestro.nombre; } if (edicion) Object.assign(m, edicion, { editadoPor: S.sesion.maestro.nombre }); }
    guardar('bib_demoMsgs', S.demoMsgs); aviso(textos[decision]); pintar(); return;
  }
  try {
    await api('moderar', { token: S.sesion.token, tipo, id, decision, nota, edicion }, true);
    aviso(textos[decision]);
  } catch(e){ aviso(/Decisión no válida/.test(e.message) ? 'Falta actualizar el servidor' : e.message, true); }
  await Promise.all([cargarPendientes(), cargarPublicas()]); pintar();
}

/* ============ COMPARTIR ============ */
const URL_APP = location.origin + location.pathname.replace(/index\.html$/, '');
const TEXTO_COMPARTIR = '📚 Biblioteca del CEIP Fernando IV\n\nConsulta cuándo está libre la biblioteca y escribe sugerencias y reseñas de libros.\nPara escribir, pide a tu maestro o maestra el código de tu clase.\n\n';
function tarjetaCompartir(){
  return `<div class="card"><div class="fila" style="justify-content:flex-start;gap:14px">
      <span class="icono">📤</span>
      <div><b>Compartir la app</b><p class="ayuda" style="margin-top:2px">Envía el enlace al alumnado o a las familias. El código de clase no se incluye: se da en clase.</p></div></div>
    <div class="grid2" style="margin-top:14px">
      <button class="btn" style="margin:0" onclick="compartirApp()">Compartir</button>
      <button class="btn sec" style="margin:0" onclick="copiarEnlace()">Copiar enlace</button>
    </div></div>`;
}
async function compartirApp(){
  if (navigator.share) {
    try { await navigator.share({ title: 'Biblioteca del CEIP Fernando IV', text: TEXTO_COMPARTIR, url: URL_APP }); } catch(e){}
  } else {
    window.open('https://wa.me/?text=' + encodeURIComponent(TEXTO_COMPARTIR + URL_APP), '_blank');
  }
}
async function copiarEnlace(){
  try { await navigator.clipboard.writeText(TEXTO_COMPARTIR + URL_APP); aviso('Mensaje y enlace copiados ✓'); }
  catch(e){ abrirHoja(`<h2>Enlace de la app</h2><p class="ayuda">Mantén pulsado para copiarlo:</p><p style="margin-top:12px;word-break:break-all"><b>${esc(URL_APP)}</b></p><button class="btn" onclick="cerrarHoja()">Hecho</button>`); }
}

/* ============ INSTALAR COMO APP ============ */
let avisoInstalar = null;
const esApp = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const esIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); avisoInstalar = e; pintar(); pintarBienvenida(); });
window.addEventListener('appinstalled', () => { avisoInstalar = null; S.instalada = true; pintar(); pintarBienvenida(); });

function tarjetaInstalar(conCerrar){
  if (esApp()) return '';
  if (conCerrar && leer('bib_sinInstalar')) return '';
  return `<div class="card instalar">
    ${conCerrar ? '<button class="cerrar" onclick="ocultarInstalar()" aria-label="Cerrar">✕</button>' : ''}
    <div class="fila" style="justify-content:flex-start;gap:14px">
      <img src="img/icono-192.png" alt="" class="ico-app">
      <div style="padding-right:22px"><b>Instala la Biblioteca como app</b>
      <p class="ayuda" style="margin-top:2px">Ábrela con un toque desde la pantalla de inicio o el escritorio, a pantalla completa.</p></div>
    </div>
    <button class="btn" style="margin-top:14px" onclick="instalarApp()">${avisoInstalar ? 'Instalar' : 'Cómo instalarla'}</button>
  </div>`;
}
function ocultarInstalar(){ guardar('bib_sinInstalar', true); pintar(); aviso('Podrás instalarla cuando quieras desde tu Perfil'); }

async function instalarApp(){
  if (avisoInstalar) {
    avisoInstalar.prompt();
    const r = await avisoInstalar.userChoice.catch(() => null);
    if (r && r.outcome === 'accepted') avisoInstalar = null;
    pintar(); return;
  }
  const paso = (n, t) => `<div class="fila" style="justify-content:flex-start;gap:12px;padding:10px 0"><span class="num-paso">${n}</span><span>${t}</span></div>`;
  let pasos;
  if (esIOS()) pasos = `<p class="etq" style="margin-top:6px">iPhone o iPad</p>
      ${paso(1, 'Abre esta web en <b>Safari</b>.')}
      ${paso(2, 'Pulsa el botón <b>Compartir</b> (el cuadrado con la flecha ↑).')}
      ${paso(3, 'Elige <b>Añadir a pantalla de inicio</b> y después <b>Añadir</b>.')}`;
  else if (/android/i.test(navigator.userAgent)) pasos = `<p class="etq" style="margin-top:6px">Android</p>
      ${paso(1, 'Abre esta web en <b>Chrome</b>.')}
      ${paso(2, 'Pulsa el menú <b>⋮</b> de arriba a la derecha.')}
      ${paso(3, 'Elige <b>Instalar aplicación</b> o <b>Añadir a pantalla de inicio</b>.')}`;
  else pasos = `<p class="etq" style="margin-top:6px">Ordenador (Chrome o Edge)</p>
      ${paso(1, 'Busca el icono de <b>instalar ⊕</b> a la derecha de la barra de direcciones y púlsalo.')}
      ${paso(2, 'Si no aparece: menú <b>⋮</b> → <b>Transmitir, guardar y compartir</b> → <b>Instalar página como aplicación</b>.')}
      ${paso(3, 'Se abrirá en su propia ventana y tendrá acceso directo en el escritorio.')}`;
  abrirHoja(`<h2>Instalar como app</h2>
    <p class="ayuda" style="font-size:15px">Se instala en un momento, no ocupa casi espacio y se actualiza sola.</p>
    ${pasos}
    <button class="btn" onclick="cerrarHoja()">Entendido</button>`);
}

/* ============ BIENVENIDA: INSTALAR PRIMERO ============ */
const ua = navigator.userAgent;
const enNavegadorInterno = () => /FBAN|FBAV|FB_IAB|Instagram|Line\/|WhatsApp|Telegram|; wv\)|GSA\//i.test(ua) || (esIOS() && !/Safari\//.test(ua));
const esAndroid = () => /android/i.test(ua);
const esMovil = () => esIOS() || esAndroid();

function pintarBienvenida(){
  const el = $('#bienvenida');
  if (esApp() || sessionStorage.getItem('bib_seguirWeb')) { el.classList.remove('on'); return; }
  const paso = (n, t) => `<div class="b-paso"><span class="num-paso">${n}</span><span>${t}</span></div>`;
  let cuerpo;
  if (S.instalada) {
    cuerpo = `<div class="b-ok">✅</div><h2>¡Instalada!</h2>
      <p class="b-sub">Ya puedes cerrar esta ventana y abrir <b>Biblioteca</b> desde la pantalla de inicio de tu móvil.</p>
      <p class="b-sub">Dentro de la app, entra en <b>Perfil</b> con el código de tu clase.</p>`;
  } else if (esMovil() && enNavegadorInterno()) {
    cuerpo = `<h2>Ábrela en ${esIOS() ? 'Safari' : 'Chrome'}</h2>
      <p class="b-sub">Desde aquí (WhatsApp u otra app) no se puede instalar. Primero hay que abrirla en el navegador:</p>
      ${esIOS()
        ? paso(1, 'Toca los <b>tres puntos ···</b> o el icono de <b>compartir</b> de esta pantalla.') + paso(2, 'Elige <b>Abrir en Safari</b> (o «Abrir en el navegador»).') + paso(3, 'En Safari aparecerán los pasos para instalarla.')
        : paso(1, 'Toca los <b>tres puntos ⋮</b> de arriba a la derecha.') + paso(2, 'Elige <b>Abrir en Chrome</b> (o «Abrir en el navegador»).') + paso(3, 'En Chrome aparecerán los pasos para instalarla.')}
      <button class="btn sec" onclick="copiarSoloEnlace()">Copiar el enlace</button>
      <p class="b-nota">Si no encuentras la opción, copia el enlace y pégalo en ${esIOS() ? 'Safari' : 'Chrome'}.</p>`;
  } else if (avisoInstalar) {
    cuerpo = `<h2>Instala la Biblioteca</h2>
      <p class="b-sub">Antes de empezar, instálala en tu ${esMovil() ? 'móvil' : 'ordenador'}. Es gratis, ocupa muy poco y se actualiza sola.</p>
      <button class="btn btn-oro b-grande" onclick="instalarApp()">📲 Instalar ahora</button>

  } else if (esIOS()) {
    cuerpo = `<h2>Instala la Biblioteca</h2>
      <p class="b-sub">Antes de empezar, instálala en tu iPhone o iPad. Es gratis y tarda un momento:</p>
      ${paso(1, 'Toca el botón <b>Compartir</b> <span class="b-ico">⬆︎</span> (el cuadrado con la flecha, abajo o arriba de Safari).')}
      ${paso(2, 'Baja y elige <b>Añadir a pantalla de inicio</b>.')}
      ${paso(3, 'Pulsa <b>Añadir</b>. Abre <b>Biblioteca</b> desde tu pantalla de inicio.')}
      <div class="b-flecha">⬇︎</div>`;
  } else if (esAndroid()) {
    cuerpo = `<h2>Instala la Biblioteca</h2>
      <p class="b-sub">Antes de empezar, instálala en tu móvil. Es gratis y tarda un momento:</p>
      ${paso(1, 'Toca los <b>tres puntos ⋮</b> de arriba a la derecha de Chrome.')}
      ${paso(2, 'Elige <b>Instalar aplicación</b> o <b>Añadir a pantalla de inicio</b>.')}
      ${paso(3, 'Confirma y abre <b>Biblioteca</b> desde tu pantalla de inicio.')}
      <p class="b-nota">¿No ves «Instalar»? En ese menú elige primero <b>Abrir en Chrome</b> y repite los pasos.</p>`;
  } else {
    cuerpo = `<h2>Instala la Biblioteca</h2>
      <p class="b-sub">Puedes instalarla en este ordenador con Chrome o Edge:</p>
      ${paso(1, 'Pulsa el icono <b>Instalar ⊕</b> a la derecha de la barra de direcciones.')}
      ${paso(2, 'Si no aparece: menú <b>⋮</b> → <b>Transmitir, guardar y compartir</b> → <b>Instalar página como aplicación</b>.')}
      ${paso(3, 'Se abrirá en su propia ventana, con acceso directo en el escritorio.')}`;
  }
  el.innerHTML = `<div class="b-caja">
      <div class="b-cab"><img src="img/icono-192.png" alt="" class="b-icono"><div><div class="centro">CEIP Fernando IV</div><div class="b-titulo">Biblioteca</div></div></div>
      ${cuerpo}
      ${S.instalada ? '' : '<button class="b-saltar" onclick="seguirEnWeb()">Seguir en el navegador sin instalar</button>'}
    </div>`;
  el.classList.add('on');
}
function seguirEnWeb(){ sessionStorage.setItem('bib_seguirWeb', '1'); pintarBienvenida(); }
async function copiarSoloEnlace(){
  try { await navigator.clipboard.writeText(URL_APP); aviso('Enlace copiado ✓'); }
  catch(e){ prompt('Copia este enlace:', URL_APP); }
}

/* ============ ARRANQUE ============ */
// Actualización automática: si hay versión nueva, la app se recarga sola (sin interrumpir si hay algo abierto).
if ('serviceWorker' in navigator) {
  const habiaControl = !!navigator.serviceWorker.controller;
  let recargando = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!habiaControl || recargando) return;
    const recargar = () => { recargando = true; sessionStorage.setItem('bib_actualizada', '1'); location.reload(); };
    if (!$('#hoja').classList.contains('on')) recargar();
    else { const t = setInterval(() => { if (!$('#hoja').classList.contains('on')) { clearInterval(t); recargar(); } }, 2000); }
  });
  window.addEventListener('load', async () => {
    try {
      const reg = await navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' });
      const buscar = () => reg.update().catch(() => {});
      document.addEventListener('visibilitychange', () => { if (!document.hidden) buscar(); });
      setInterval(buscar, 15 * 60 * 1000);
    } catch(e) {}
  });
  if (sessionStorage.getItem('bib_actualizada')) { sessionStorage.removeItem('bib_actualizada'); setTimeout(() => aviso('App actualizada ✓'), 600); }
}
leerCache();
pintar();
pintarBienvenida();
refrescar();
if (esMaestro()) cargarClases();
setInterval(() => { actualizarReloj(); if (!document.hidden && !$('#hoja').classList.contains('on')) { pintar(); refrescar(); } }, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refrescar(); });
</script>
